# ---------------------------------------------------------------------------
# miw variants: the Measured Intrinsic Wavefront (MIW), one variant per
# measured-intrinsic configuration.
#
# SOURCE OF TRUTH.  aos/mi_config.yaml is GENERATED from this file:
#
#     python -m rubinwork.products.miw.gen_mi_config
#
# Edit this file, never the generated one.  The generated file cannot be retired, now or
# in phase 5: lsst.ts.intrinsic.wavefront.mi_config.default_config_path() returns
# Path('mi_config.yaml') relative to the current working directory, with no other
# candidate, and ten things read it through that default -- the three build runners in
# ts_intrinsic_wavefront/bin/ plus seven aos/code scripts.  So the generated file must
# stay BYTE-IDENTICAL across the phase 3a move, which is the acceptance test.
#
# WHY THE CONFIGURATION IS HELD AS LITERAL TEXT BLOCKS.  mi_config.yaml is hand-written
# and carries comments *inside* entries -- the day_obs_max freeze note, the
# Range-Bounded Recovery (RBR) rationale blocks, the per-param_set preambles.  Parsing
# those into a data structure and re-emitting them loses the comments (yaml.safe_dump) or
# moves them (a ruamel round-trip through a reshaped structure: the tokens attach to key
# names and sequence indices, so regrouping the entries scatters them).  Holding each
# block as a `text:` scalar and concatenating makes byte-identity true BY CONSTRUCTION,
# and keeps every comment exactly where its author put it.
#
# So: edit the `text:` block of the entry you mean, in the YAML it will appear as.  The
# fields beside it -- `variant`, `mi_name`, `dir_name` -- are the product's index into
# those blocks, and the generator asserts they agree with the text.
#
# The variant name is the upstream Full Array Mode (FAM) variant's `short_code`, then the
# entry's `dir_name` -- which is also the output subdirectory in the old tree,
# aos/output/miw/<P>_<M>/, so the two stay traceable.
#
# Structure:
#
#   defaults_text   the generated file's `defaults:` block, applied to every entry by
#                   lsst.ts.intrinsic.wavefront.mi_config.load_mi_config (deep merge, so
#                   nested build:/split: dicts combine key by key)
#   lead_text       what sits between `measured_intrinsics:` and the first param_set key,
#                   today the commented-out danish_1_0 group kept for provenance
#   groups          one per param_set, in generated-file order:
#                     fam_variant  the fam_tables variant whose tables the build reads
#                     param_set    the long aos/param_sets.yaml key, the recorded identity
#                     short_code   the variant-name prefix (d12, d13)
#                     key_text     the param_set key line and the comment block above it
#                     entries      one per MIW variant:
#                                    variant   the product variant name
#                                    mi_name   the entry's `name`: what --mi-name takes,
#                                              what build_from refers to, and what
#                                              analysis_config.yaml overrides key on
#                                    dir_name  the entry's `dir_name`
#                                    text      the entry's own YAML block
#   external        variants registered as manifests with a `location` and no files; they
#                   never reach the generated file
#
# Naming convention for mi_name: <path><n_dof>_<n_keep>_<filter>, e.g. pathA_50_34_i
#   (first number = n_dof, second = n_keep).  The `path` prefix is redundant with the
#   `path:` key, so dir_name drops it (A_50_34_i); mi_name keeps it.
#
# n_dof / n_keep may be a SCALAR or a LIST:
#   scalar n   -> indices 0 .. n-1   (n_dof: 50 = all DOF; n_keep: 34 = modes 0..33)
#   list [...] -> exactly those indices (to drop individual DOF or v-modes)
#
# Keys inside an entry's text, beyond name / dir_name / n_dof / n_keep:
#   path          A (U-mode constrained) | B (reachability)
#   filter        band or list of bands (null = all)
#   programs      science_program (block) whitelist; null = all
#   alt_min_deg / alt_max_deg   elevation window in degrees
#   rotator_bins  list of [lo, hi] camera rotator angle windows in degrees; the build runs
#                 once per bin
#   build:        build params (k_min/k_max, n_iter, n_bins, fp_radius_*, min_donuts,
#                 bad_fit_threshold, max_visits, ofc_normalization_yaml, height_source,
#                 batoid_rubin_height_map_dir, height_map_fits, height_to_z4_factor,
#                 wfs_edge_cut_deg, range_bounded_recovery and its rbr_* knobs, ...)
#   split:        OCS/CCS decomposition params (rotator_select, split_js, ocs_only, ...)
#   build_from    reuse another entry's already-built per-rotator-bin grids; such an entry
#                 re-runs only the split and what follows, and triggers no build_intrinsic
#   day_obs_max   latest night the build may draw from
#   coord_sys     OCS (default)
# ---------------------------------------------------------------------------

defaults_text: |+
  defaults:
    path: A
    filter: [i]
    programs: [BLOCK-T614_triplets]
    alt_min_deg: 65.0
    alt_max_deg: 75.0
    coord_sys: OCS
    rotator_bins:
      - [-65.0, -55.0]
      - [-50.0, -40.0]
      - [-35.0, -25.0]
      - [-20.0, -10.0]
      - [-3.0, 3.0]
      - [10.0, 20.0]
      - [25.0, 35.0]
      - [40.0, 50.0]
      - [55.0, 65.0]
    build:
      k_min: 1
      k_max: 6
      n_iter: 3
      n_bins: 73
      fp_radius_basis: 1.8
      fp_radius_grid: 1.8
      min_donuts: 100
      bad_fit_threshold: 2.0
      max_visits: null
      ofc_normalization_yaml: null      # null -> ts_config_mttcs range0.5_fwhm-0.15.yaml
      height_source: batoid_rubin
      batoid_rubin_height_map_dir: ~/u/LSST/packages/batoid_rubin_data  # holds ccd_height_map.fits.gz; null -> ensure_data_dir, which downloads into the read-only conda env (PermissionError on USDF)
      height_map_fits: null             # metrology source only
      height_to_z4_factor: 15.0         # μm of Z4 per mm of CCD piston
      wfs_edge_cut_deg: 1.75
    split:
      rotation_sign: 1                  # fixed field-rotation sense: +1 | -1
      spin_sign: 1
      m_max: 12
      degen_assignment: ocs             # ocs | ccs | split
      ridge: 1.0e-3
      hole_dist: 0.06
      r_min: 0.06
      r_max: 1.75
      n_r: 80
      n_az: 180
      r_lim_lo: 0.1
      r_lim_hi: 1.6
      use_z4_optical: true
    # NOTE: LUT / aberration-pairs knobs live in analysis_config.yaml, NOT here —
    # they must not re-trigger the per-rotator-bin build when edited.

lead_text: |2+

    # ---- Superseded 2026-09-06: outputs in output/archive/, chunks disabled in
    # ---- snake_config.yaml. Re-enable both files together to rebuild.
    # ---- Kept: pathA_50_34_i_5rot here is the build recorded as the provenance of the
    # ---- staged v1 MIW, aos/calibration/miw/intrinsic_split_maps_v1.parquet.
    # fam_danish_1_0_wep17_3_0_bin2x:
    #   - name: pathA_50_34_i
    #     n_dof: 50
    #     n_keep: 34
    #   - name: pathA_50_50_i
    #     n_dof: 50
    #     n_keep: 50
    #   # March-only (drop out-of-family April-9): reuse pathA_50_34_i's build grids
    #   # and decompose only the 5 in-family rotator bins (April-9 sits solely in the
    #   # +-30/+-45 bins, so this excludes it by angle).  OCS/CCS split for Z4-Z8;
    #   # Z9+ approximated as OCS-only.
    #   - name: pathA_50_34_i_5rot
    #     n_dof: 50
    #     n_keep: 34
    #     build_from: pathA_50_34_i
    #     split:
    #       rotator_select:
    #         - [-65.0, -55.0]
    #         - [-20.0, -10.0]
    #         - [-3.0, 3.0]
    #         - [10.0, 20.0]
    #         - [55.0, 65.0]
    #       split_js: [4]

groups:
  - fam_variant: danish_1_2
    param_set: fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x
    short_code: d12
    key_text: |2
        fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x:
    entries:
      - variant: d12-A_50_34_i
        mi_name: pathA_50_34_i
        dir_name: A_50_34_i
        text: |2
              - name: pathA_50_34_i
                dir_name: A_50_34_i
                n_dof: 50
                n_keep: 34
                # Freeze the MIW to chunks 1-3 (<= 20260513): the combined donuts/visits now
                # also carry chunk 4 (>= 20260514, the danish wep_17_7_0 reprocessing), but
                # the MIW build must omit it so a rebuild reproduces the same intrinsic.
                # pathA_50_34_i_5rot reuses these grids (build_from) so it inherits the cut.
                day_obs_max: 20260513
              # March-only (drop out-of-family April-9): reuse pathA_50_34_i's build grids
              # and decompose only the 5 in-family rotator bins (April-9 sits solely in the
              # +-30/+-45 bins, so this excludes it by angle).  OCS/CCS split for Z4-Z8;
              # Z9+ approximated as OCS-only.
      - variant: d12-A_50_34_i_5rot
        mi_name: pathA_50_34_i_5rot
        dir_name: A_50_34_i_5rot
        text: |2
              - name: pathA_50_34_i_5rot
                dir_name: A_50_34_i_5rot
                n_dof: 50
                n_keep: 34
                build_from: pathA_50_34_i
                split:
                  rotator_select:
                    - [-65.0, -55.0]
                    - [-20.0, -10.0]
                    - [-3.0, 3.0]
                    - [10.0, 20.0]
                    - [55.0, 65.0]
                  split_js: [4]

            # Danish 1.3 v3.14 pupil model (T614 and sensitivity blocks).  The default cuts
            # select 301 visits on five nights; the 2025 visits are other programs.
  - fam_variant: danish_1_3
    param_set: danish_1_3
    short_code: d13
    key_text: |2
        danish_1_3:
    entries:
      - variant: d13-A_50_34_i
        mi_name: pathA_50_34_i
        dir_name: A_50_34_i
        text: |2
              - name: pathA_50_34_i
                dir_name: A_50_34_i
                n_dof: 50
                n_keep: 34
      - variant: d13-A_50_34_i_5rot
        mi_name: pathA_50_34_i_5rot
        dir_name: A_50_34_i_5rot
        text: |2
              - name: pathA_50_34_i_5rot
                dir_name: A_50_34_i_5rot
                n_dof: 50
                n_keep: 34
                build_from: pathA_50_34_i
                split:
                  rotator_select:
                    - [-65.0, -55.0]
                    - [-20.0, -10.0]
                    - [-3.0, 3.0]
                    - [10.0, 20.0]
                    - [55.0, 65.0]
                  split_js: [4]

              # Range-Bounded Recovery over all 50 DOF and 50 v-modes.  rbr_penalty_weight
              # is the barrier weight lambda in um^2 of wavefront.  n_iter is the outer MIW
              # iteration; the maps settle by iteration 3.
      - variant: d13-A_50_50_i_rbr
        mi_name: pathA_50_50_i_rbr
        dir_name: A_50_50_i_rbr
        text: |2
              - name: pathA_50_50_i_rbr
                dir_name: A_50_50_i_rbr
                n_dof: 50
                n_keep: 50
                build:
                  range_bounded_recovery: true
                  rbr_full_dof: true
                  rbr_kappa: 4.0
                  rbr_power: 3
                  rbr_penalty_weight: 1.0
                  n_iter: 3

              # The 50/50 RBR split, on the same five rotator bins as pathA_50_34_i_5rot.
      - variant: d13-A_50_50_i_rbr_5rot
        mi_name: pathA_50_50_i_rbr_5rot
        dir_name: A_50_50_i_rbr_5rot
        text: |2
              - name: pathA_50_50_i_rbr_5rot
                dir_name: A_50_50_i_rbr_5rot
                n_dof: 50
                n_keep: 50
                build_from: pathA_50_50_i_rbr
                build:
                  range_bounded_recovery: true
                  rbr_full_dof: true
                  rbr_kappa: 4.0
                  rbr_power: 3
                  rbr_penalty_weight: 1.0
                  n_iter: 3
                split:
                  rotator_select:
                    - [-65.0, -55.0]
                    - [-20.0, -10.0]
                    - [-3.0, 3.0]
                    - [10.0, 20.0]
                    - [55.0, 65.0]
                  split_js: [4]

# ---------------------------------------------------------------------------
# EXTERNAL variants: registered as manifests with a `location` and no files.  NOT emitted
# into the generated aos/mi_config.yaml -- nothing here builds them, and the official MIW
# must not depend on anything private to this repository.
# ---------------------------------------------------------------------------
external:

  # The certified calibration collection: the official MIW as an lsst.ip.isr
  # IntrinsicZernikes calib, one intrinsicZernikes dataset per (detector, band).  Probed
  # 2026-10-10 in /repo/main: 1230 datasets (count, dimensionless) over bands u g r i z y,
  # i.e. 205 detectors x 6 bands.  This is what the Danish 1.3 blitz FAM and corner
  # processing read as their intrinsic.
  official-20260528a:
    kind: butler_calibration
    location: LSSTCam/calib/DM-55048/intrinsicZernikes.v1.0/intrinsicsGen.20260528a
    butler_repo: /repo/main
    dataset_type: intrinsicZernikes
    description: >-
      Official MIW calibration, DM-55048 intrinsicZernikes v1.0, intrinsicsGen 20260528a.
      Built by ts_intrinsic_wavefront outside this repository.

  # Guillem's user collection, the same 1230 datasets, read by default by five optatmo
  # scripts (optatmo/code/miw.py, fit_optatmo.py, ensemble_corners.py, plot_miw_maps.py,
  # plot_data_model.py).
  official-gmegias-v3:
    kind: butler_calibration
    location: u/gmegias/calib/DM-55048/intrinsicZernikes.v3
    butler_repo: /repo/main
    dataset_type: intrinsicZernikes
    description: >-
      Official MIW calibration as the DM-55048 v3 user collection; 1230 intrinsicZernikes
      datasets over six bands, probed 2026-10-10.

  # The frozen in-repo copy of a local MIW build's OCS/CCS field maps, staged into git so
  # the static-optics and back-projection work has a version-tracked intrinsic.  Its
  # provenance.yaml, tracked beside it, records the build it came from.  aos/calibration/
  # is NOT touched by this product: the manifest only points at it.
  staged-v1:
    kind: staged_parquet
    location: aos/calibration/miw/intrinsic_split_maps_v1.parquet
    provenance: aos/calibration/miw/intrinsic_split_maps_v1.provenance.yaml
    source_param_set: fam_danish_1_0_wep17_3_0_bin2x
    source_mi_name: pathA_50_34_i_5rot
    source_git_sha: 9fce54352aa114b06100cddbafe10a3f3d2134a9
    description: >-
      Frozen v1 intrinsic_split_maps, staged 2026-06-24 from the danish_1_0
      pathA_50_34_i_5rot build; 5 rotator bins, OCS/CCS split for Z4 and OCS-only above.
