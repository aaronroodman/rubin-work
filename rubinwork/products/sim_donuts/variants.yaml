# ---------------------------------------------------------------------------
# sim_donuts variants: noise-free donuts ray-traced through a batoid model.
#
# Per-entry fields:
#   intrinsic     batoid_intrinsic variant supplying the model, the defocus configurations
#                 and the field points; the build read is recorded in the manifest
#   bands         bands traced
#   fwhm_arcsec   Kolmogorov blur FWHM, arcsec
#   oversample    fine pixels per pixel side for the ray deposit
#   configs       per defocus configuration: stamp side (npix, odd for Danish, 10 um
#                 pixels; the chief ray is on the centre pixel), stop-plane
#                 ray spacing (mm), and optionally the science-grid rings and spokes kept
#                 (default every point of the intrinsic grid)
#
# A different blur, wavelength treatment or point set is a new variant.
# ---------------------------------------------------------------------------
defaults:
  intrinsic: v4_speed
  bands: [r]
  fwhm_arcsec: 1.0
  oversample: 3
  configs:
    fam: {npix: 181, ray_spacing_mm: 8.0}
    cwfs: {npix: 181, ray_spacing_mm: 8.0}
    giant: {npix: 801, ray_spacing_mm: 3.5, rings: [0, 2, 4, 6, 8, 10],
            spokes: [0, 5, 10, 15, 20, 25, 30]}

variants:

  # Monochromatic at the ts_wep band wavelength (r: 619.4 nm), rotator angle 0 deg.
  v4_speed_mono: {}
