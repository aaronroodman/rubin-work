# ---------------------------------------------------------------------------
# cwfs_tables variants: the in-focus corner-wavefront-sensor (CWFS) tables, paired to the
# Full Array Mode (FAM) triplets.
#
# SOURCE OF TRUTH for the FAM/CWFS triplet link. These entries were the
# `wfs_collections` maps of rubinwork/products/fam_tables/variants.yaml until phase 3a of
# notes/status/organization_plan.md; that file no longer carries them.
# rubinwork/products/fam_tables/gen_param_sets.py merges this file back into the generated
# aos/param_sets.yaml, which must stay byte-identical, because the EXTERNAL package
# lsst.ts.intrinsic.wavefront.intrinsics_lib.load_param_sets() is what the builder reads
# its collection through.
#
# The variant name is the upstream FAM variant's short code, `d12` for `danish_1_2`, then
# the name the entry had in `wfs_collections` -- which is also the output subdirectory in
# the old tree, aos/output/wfs_ingest/<P>/<name>/, so the two stay traceable.
#
# Triplet order is intra, extra, in-focus, and the FAM key is the EXTRA exposure, so the
# in-focus exposure is FAM_seq + 1. Per-entry fields:
#
#   fam_variant   the fam_tables variant whose visits.parquet drives the walk (required)
#   upstream_name the key this entry had in that variant's wfs_collections map, which is
#                 the name the generated aos/param_sets.yaml must still use (required)
#   collection    the Butler collection (required)
#   seq_offset    added to the FAM seq_num (the extra exposure): +1 = in-focus (the
#                 default), 0 = extra, -1 = intra
#   dataset_type  aggregate to read, when it is not aggregateAOSVisitTableRaw
#   reader        `unpaired` to read the singular-position table
#
# `upstream_name` is explicit rather than derived by stripping the `d12-` prefix, so the
# mapping back to the generated file is one-way and auditable.
# ---------------------------------------------------------------------------

variants:

  # One variant covering 2025 and 2026, as the FAM `danish_1_2` already does with its
  # per-chunk collection overrides (folded in phase 3b, Aaron 2026-10-10).  The two
  # collections are disjoint in day_obs -- the 17.6.1 refitWcs holds 2026 and finds no
  # aggregate for 2025, Chris's 17.7.0 reprocessing holds 2025 and none for 2026 -- so the
  # night decides which to query, and the builder opens one Butler per collection.
  # In-focus exposure = FAM extra + 1, so seq_offset takes its +1 default.
  d12-refitWcs:
    fam_variant: danish_1_2
    upstream_name: refitWcs
    collections:
      - day_obs: [20260101, 20261231]
        collection: LSSTCam/runs/aos/fam_cwfs_triplet/danish_1_2_0_alpha0/wep_17_6_1/dv_4_5_0/bin_x2/refitWcs
      - day_obs: [20250101, 20251231]
        collection: LSSTCam/runs/aos/cwfs/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs/2025

  # Bryce's paired 3mm-defocus corner donuts, wep 17.8.0 / donut_viz 4.7.0.
  d12-paired_3mm:
    fam_variant: danish_1_2
    upstream_name: paired_3mm
    collection: LSSTCam/runs/aos/paired_cwfs_3mm_donuts/wep_v17_8_0/donut_viz_4_7_0/danish_v1_2_0/bin2x
    seq_offset: 0   # aggregate keyed to the FAM extra exposure (= FAM seq), not in-focus fam+1

  # No joined aggregateAOSVisitTableRaw, so run_wfs_mktable's aggregateZernikesRaw reader
  # joins zk from aggregateZernikesRaw with positions from the per-detector `zernikes`
  # (field deg, x<->y swap -> CCS, then R(rotTelPos) -> OCS).
  d12-ai_donut:
    fam_variant: danish_1_2
    upstream_name: ai_donut
    collection: LSSTCam/runs/aos/fam_cwfs_triplet/danish_1_2_0_alpha0/wep_17_6_1/dv_4_5_0/ai_donut/binned
    dataset_type: aggregateZernikesRaw

  # TARTS in-focus analysis of the triplet (peterma2).  Uses the Avg aggregate:
  # aggregateAOSVisitTableAvg is TARTS's ML-combined per-detector value, one row per corner
  # half-sensor with all 8 in the single in-focus exposure, verified equal to the
  # `zernikes` label=='average' row in zk_CCS.  The aggregate also carries the rotated
  # zk_OCS and thx_OCS/thy_OCS, all in microns.  With one row per detector the unpaired
  # reader needs no combine_offsets or defocused_only.  TARTS Noll (Z4-Z28) is remapped to
  # the FAM Noll in run_wfs_mktable.
  d12-tarts:
    fam_variant: danish_1_2
    upstream_name: tarts
    collection: u/peterma2/tarts_fam_acq_stability_infocus
    reader: unpaired
    dataset_type: aggregateAOSVisitTableAvg

  # ---------------------------------------------------------------------------
  # RETIRED in phase 3b, 2026-10-12 (Aaron): the `d10-wep17_3_0` entry is gone. It was
  # never built, and nothing reads a CWFS table for `danish_1_0`.
  #
  # The FAM variant `danish_1_0` itself STAYS, as `registered: false` in
  # rubinwork/products/fam_tables/variants.yaml (Aaron, 2026-10-12): four live things
  # still name its long param_set key -- the staged-MIW provenance chain in
  # aos/calibration/, the aos-measured-intrinsics tech note's make_figures.py, an
  # overrides: block in aos/analysis_config.yaml, and a fam_tables test -- and the plan
  # allows `registered: false` where removal would break a reader.
  # ---------------------------------------------------------------------------

  # Danish 1.3 blitz UNPAIRED corner wavefront, v3.14 pupil model, paired to the
  # danish_1_3 FAM.  One variant over several runs (Aaron, 2026-10-24): the science CWFS
  # reprocessing (RSO-1071, Chris Suberlak, 92,392 visits over 191 nights 20251021-20260714)
  # first, then Josh Meyers' T614, sensitivity and bounce corner runs, searched in that
  # order.  The T614 and bounce visits are all in the science run; 914 of the 989
  # sensitivity visits (count) are only in Josh's.  Each visit's table holds both corner
  # halves, SW1 intra and SW0 extra, tagged by wfs_offset.  The bounce corner visits pair
  # with the bounce FAM run (2026-10-28); FAM 2026071100064 has no corner partner.
  d13-blitz_unpaired:
    fam_variant: danish_1_3
    upstream_name: blitz_unpaired
    collections:
      - LSSTCam/runs/aos/cwfs/danish_1_3_0/wep_blitz_rso1071/dv_blitz_rso1071/bin_x2/unpaired/donutBlitz
      - u/jmeyers3/t614_corner_unpaired_v3.14
      - u/jmeyers3/sensitivity_corner_unpaired_v3.14
      - u/jmeyers3/bounce_corner_unpaired_v3.14
    reader: blitz_corner
    dataset_type: donutBlitzCornerResults
