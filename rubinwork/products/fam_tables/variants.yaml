# fam_tables variants: short variant name -> full configuration.
#
# Built from aos/param_sets.yaml during phase 2 of notes/status/organization_plan.md.
# The variant name is today's `dir_name`, which is already short and is what the output
# directories use.  `param_set` carries the long aos/param_sets.yaml key, which remains
# the identity for everything that recorded it: the value-added DB rows
# (fam_variant.fam_variant_id / .param_set / .fits_path, state_variant.intrinsic_ref),
# the frozen provenance files, and `--param-set` on the command line.  Keeping both
# means registering a build does not rename anything.
#
# Only the in-use variants are registered.  `danish_1_1_1` and
# `danish_1_2_0_wep17_7_0_2025` are not param_sets at all — the first is gone from
# param_sets.yaml, and the second is a per-chunk `phrase` of the five 2025 chunks that
# fold into danish_1_2.
#
# builder: which build path produces the tables.
#   snakemake -- mktable + fit + combine_* + attach_telemetry, per date chunk
#   blitz     -- run_blitz_mktable recasts unpaired donutBlitzFamResults into this
#                schema and writes the combined tables directly, so there are no chunks
#
# registered: false means "emit into the generated param_sets.yaml, but this is not a
# product build".  Used only by danish_1_0 — see its entry.
#
# ---------------------------------------------------------------------------
# THIS FILE IS THE SOURCE OF TRUTH.  aos/param_sets.yaml is GENERATED from it:
#
#     python -m rubinwork.products.fam_tables.gen_param_sets
#
# Edit this file, never the generated one.  This file owns the Full Array Mode (FAM) half
# only.  The in-focus corner-wavefront-sensor (CWFS) member of the same triplet moved to
# rubinwork/products/cwfs_tables/variants.yaml in phase 3a, and gen_param_sets.py merges
# the two back into the generated file; the `wfs_collections` maps that used to sit in the
# entries below are there now.  The measured intrinsic wavefront (MIW) is built from the
# FAM tables alone, so ts_intrinsic_wavefront needs only this half.
#
# aos/param_sets.yaml cannot simply be deleted, now or in phase 5: the EXTERNAL package
# lsst.ts.intrinsic.wavefront.intrinsics_lib.load_param_sets() opens
# Path('param_sets.yaml') relative to the current working directory, and
# run_wfs_mktable.py (now in cwfs_tables), aos/code/cwfs/run_wfs_fam_compare.py,
# run_wfs_refit_ensemble.py and aos/code/fam_processing/check_chunk.py all call it.
# ---------------------------------------------------------------------------

variants:

  # ---------------------------------------------------------------------------
  # SUPERSEDED as a working param_set by danish_1_2, but kept and NOT renamed: the long
  # param_set name below is the recorded provenance of the local MIW build staged at
  # aos/calibration/miw/intrinsic_split_maps_v1.parquet (see its .provenance.yaml, tracked
  # in git) and of the two-epochs tech note (notes/aos-measured-intrinsics/provenance.md).
  # Both must keep resolving to this collection.  The official MIW is Guillem's, built by
  # ts_intrinsic_wavefront and read from the Butler, not this one.  Its chunks are disabled
  # in aos/snake_config.yaml and its output sits in aos/output/archive/, so nothing
  # rebuilds it.
  #
  # registered: false — it is emitted into the generated param_sets.yaml so the frozen
  # provenance keeps resolving, but it is NOT a product build and variants()/load() do not
  # return it.
  # ---------------------------------------------------------------------------
  danish_1_0:
    param_set: fam_danish_1_0_wep17_3_0_bin2x
    registered: false
    builder: snakemake
    description: >-
      Mar-May 2026, /repo/main, Danish 1.0 wep 17.3.0 dv 4.2.0 bin x2 paired
    butler_repo: /repo/main
    coord_sys: OCS
    fam_programs: [T278, T381, T492, T539, T614, T710, T717, T720, T724]
    fam_collections:
      - LSSTCam/runs/aos/fam/danish_1_0/wep_17_3_0/dv_4_2_0/bin_x2/paired
    collection_phrase: aos_fam_danish_1_0_wep17_3_0_bin2x
    day_obs_min: 20260315
    day_obs_max: 20260531

  # ---------------------------------------------------------------------------
  # danish_1_2 folds in the 2025 FAM reprocessing (Danish 1.2.0, wep 17.7.0, dviz 4.7.0,
  # bin x2, paired, refitWcs — Chris's run).  The 17.7.0 base FAM collection spans
  # 2025-04..2026-07, so the 2025 FAM arrives as five extra date chunks below rather than
  # a standalone variant; they carry their own collection, phrase and
  # programs: [BLOCK, CWFS, AOSSEQUENCE] (all 2243 2025 FAM visits) and combine into this
  # variant's tables so the coadd runs over 2025+2026 together.
  #
  # Canonical 2025 program groups (substring-matched; filter at coadd time via
  # run_fam_coadd_miw --programs, or when building a stable-only MIW/sidecar — the MIW
  # build has NO program filter, so its source must be stable-only):
  #   STABLE   (1204): T278 T381 T393 T395 T475 T492 T539 T559 T614 T717 T720 T724
  #   S-MATRIX (837) : T197 T377 T378 T379 T380 T503 T598 T606
  #   other    (202) : T417 T459 T460 T519 T609 T615 T626 T630 CWFS AOSSEQUENCE
  #
  # 2025 corner-WFS is a SEPARATE collection and wfs_collections is variant-level, so the
  # 2025 chunks do NOT pull in 2025 CWFS by themselves — that is what the refitWcs_2025
  # entry in wfs_collections is for.
  # ---------------------------------------------------------------------------
  danish_1_2:
    param_set: fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x
    builder: snakemake
    description: >-
      Mar-May 2026 plus the 2025 reprocessing, /repo/main, Danish 1.2.0_alpha
      wep 17.6.1 dv 4.5.0 bin x2 paired; refitWCS stamps
    butler_repo: /repo/main
    coord_sys: OCS
    fam_programs: [T278, T381, T492, T539, T614, T710, T717, T720, T724]
    fam_collections:
      - LSSTCam/runs/aos/fam/danish_1_2_0_alpha0/wep_17_6_1/dv_4_5_0/bin_x2/paired/refitWcs
    collection_phrase: aos_fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x
    day_obs_min: 20260315
    day_obs_max: 20260531
    # Date chunks, from aos/snake_config.yaml.  A chunk may override the collection,
    # the Butler repo and the program filter; the three bare ranges read the
    # param_set-level 17.6.1 collection.  All chunks combine into one set of tables.
    chunks:
      - day_obs: [20260315, 20260327]
      - day_obs: [20260331, 20260409]
      # Range narrowed from 20260531 to 20260513 to stop overlapping the next chunk:
      # the built chunk holds 219 visits with max day_obs 20260513 and none after it.
      # The existing build 20260920 keeps the old directory name 20260418_20260531.
      - day_obs: [20260418, 20260513]
      - day_obs: [20260514, 20260731]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x
      - day_obs: [20260713, 20260713]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_embargo0713
        butler_repo: /repo/embargo
      - day_obs: [20250415, 20250531]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20250601, 20250930]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20251001, 20251115]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20251116, 20251130]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20251201, 20251231]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]

  # ---------------------------------------------------------------------------
  # Danish 1.3 "blitz" unpaired FAM (Josh Meyers).  The blitz pipeline writes one
  # donutBlitzFamResults table per visit holding one row per donut per EXPOSURE, so both
  # sides of focus sit in the same table, distinguished by its visit_id column.
  # run_blitz_mktable.py recasts that into the paired Danish 1.2 donuts/visits schema —
  # joining the two sides on the Gaia source id and averaging the wavefront — so the
  # existing DZ fit runs on it unchanged.
  #
  # No wfs_collections for either 1.3 variant: the sibling corner product
  # u/jmeyers3/t614_corner_unpaired is a different dataset type (donutBlitzResults) that
  # run_wfs_mktable cannot read yet.
  # ---------------------------------------------------------------------------
  danish_1_3_test:
    param_set: danish_1_3_test
    builder: blitz
    description: >-
      Mar-Jun 2026, /repo/main, Danish 1.3 blitz wep 16.6.0 danish 1.2.1 bin x2
      UNPAIRED; default Batoid intrinsics from the dataset type
    butler_repo: /repo/main
    coord_sys: OCS
    fam_programs: [T614]
    fam_collections:
      - u/jmeyers3/t614_fam_unpaired
    collection_phrase: aos_fam_danish_1_3_blitz_unpaired
    day_obs_min: 20260315
    day_obs_max: 20260619

  # ---------------------------------------------------------------------------
  # The same blitz unpaired FAM retrieval on the v1000 PUPIL MODEL: the Batoid as-built
  # model plus the updated M1M3 measurements and the M1 outer and inner baffles, whose
  # M1Baffle1/M1Baffle2 ClearCircle surfaces at radius 4.165 m sit 15 mm inside M1's
  # 4.18 m rim.  Josh's collection suffix IS the pupil model.  Paired with
  # danish_1_3_test to measure what the baffle does to the MIW.
  #
  # Coverage is identical to danish_1_3_test — 966 donutBlitzFamResults over the same 15
  # nights — so day_obs_min/max carry over unchanged.
  #
  # What differs from danish_1_3_test, measured from the Butler 2026-10-04 rather than
  # assumed.  danish_1_3_test's collection is the LEGACY pupil model but is ALSO an older
  # code version, so the pair is not a pure pupil-model difference:
  #   pupil mask   policy:masks/LsstCamLegacy.yaml -> RubinObsc_v1000_r_rtpp0_azp45_pp0d0.yaml
  #   danish       5037d9f3 -> ca41ae8c
  #   ts_wep       9651cd23 -> 639a89d9
  #   task label   donutBlitzFamTask -> donutBlitzFam (the config field maskModel did not
  #                exist in the older task at all)
  # Accepted deliberately: the code changes between those commits are small, so the pupil
  # model is the leading term.  u/jmeyers3/t614_fam_unpaired_legacy is the airtight
  # baseline if one is ever wanted — it differs from the v1000 run in exactly one config
  # line, maskModel, on the same danish commit — but it costs a third build and is not
  # needed for the leading-term result.
  # ---------------------------------------------------------------------------
  danish_1_3_v1000:
    param_set: danish_1_3_v1000
    builder: blitz
    description: >-
      Mar-Jun 2026, /repo/main, Danish 1.3 blitz wep 16.6.0 danish 1.2.1 bin x2
      UNPAIRED, v1000 pupil model (as-built + M1M3 + M1 baffles); default Batoid
      intrinsics from the dataset type
    butler_repo: /repo/main
    coord_sys: OCS
    fam_programs: [T614]
    fam_collections:
      - u/jmeyers3/t614_fam_unpaired_v1000
    collection_phrase: aos_fam_danish_1_3_blitz_unpaired_v1000
    day_obs_min: 20260315
    day_obs_max: 20260619
