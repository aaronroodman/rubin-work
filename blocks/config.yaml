# BLOCK-T539 closed-loop AOS state pipeline configuration.
day_obs_min: 20260420
day_obs_max: 20260708          # bump to today when re-running

instrument: lsstcam
# 'auto' picks by environment (in_rsp() via /etc/nublado): in-pod host inside the
# RSP, external token-injected endpoint (https://usdf-rsp.slac.stanford.edu/consdb,
# token from $ACCESS_TOKEN / ~/.lsst/consdb_token) on S3DF/sdfiana/slacrd.
# Override with an explicit URL if needed.
consdb_url: "auto"
efd: usdf_efd                  # summit_efd when running on the Summit RSP

# OFC config dir for the sensitivity matrix / v-mode SVD (v13 = telescope AOS)
ofc_config_dir: "/sdf/group/rubin/u/roodman/LSST/packages/ts_config_mttcs/MTAOS/v13/ofc"

# Selection: converged closed-loop in-focus images
science_program_prefix: "BLOCK-T539"
observation_reason: "infocus_initial_alignment"
annotations:
  - closed_loop_hexapods_10dof_trunc5
  - closed_loop_22dof_trunc12
seq_gap_max: 10                # max seq_num gap within one contiguous run
n_vmode: 12

# Telemetry source: 'consdb' = ConsDB transformed EFD per-exposure means (fast,
# ~2 queries, no per-visit raw EFD; M1M3 gradients still from raw EFD).
# 'efd' = original raw per-visit EFD path (cross-check / uncovered time ranges).
telemetry_source: consdb

# Per-night full-telemetry tables (all science visits in a night) for studying
# mirror LUT bending modes across the full elevation range.  One parquet each.
nights:
  - 20260629
