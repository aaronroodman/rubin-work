# ----------------------------------------------------------------------
# Snakemake pipeline config.
# Each param_set lists the date chunks to process: mktable + fit run per
# chunk, then `combine` concatenates the chunks into one param_set-level
# table (output/<param_set>/{donuts,fits,visits}.parquet) that all
# downstream steps use.  Butler/collection definitions live in
# param_sets.yaml (referenced by name).
#
# Add data -> add/edit a chunk -> Snakemake re-runs combine + downstream.
# (Chunks derived from the old runs.yaml.)
# ----------------------------------------------------------------------
param_sets:

  fam_danish_v1_triplets_bin_2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260430]

  fam_danish_v1_triplets_bin_1x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260430]

  fam_danish_1_0_wep17_3_0_bin2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260531]

  fam_danish_1_1_1_wep17_3_0_bin2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260531]

  fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260531]
      # Newer, DISJOINT visits (post May 13; extra elevation/rotator points) from
      # the danish_1_2_0 wep 17.7.0 reprocessing.  This chunk targets its OWN
      # collection, so the three chunks above keep reading the 17.6.1 collection.
      # Combines into the SAME output/fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x/.
      # Widen day_obs to the new collection's actual span if visits fall outside.
      - day_obs: [20260514, 20260731]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x
