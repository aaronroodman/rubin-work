# ----------------------------------------------------------------------
# Snakemake pipeline config.
# Each param_set lists the date chunks to process: mktable + fit run per
# chunk, then `combine` concatenates the chunks into one param_set-level
# table (output/<param_set>/{donuts,fits,visits}.parquet) that all
# downstream steps use.  Butler/collection definitions live in
# param_sets.yaml (referenced by name).
#
# Add data -> add/edit a chunk -> Snakemake re-runs combine + downstream.
# (Chunks derived from the old runs.yaml.)
# ----------------------------------------------------------------------
# run_mktable speed knobs (applied to every mktable/chunk build):
#   workers    -- parallel processes for the per-visit Butler donut/Zernike reads
#                 (1 = serial; raise on a batch node, e.g. 8).
#   no_thermal -- skip the per-visit ESS-temperature EFD loop (fast; leaves the
#                 thermal columns empty). Use to get donuts quickly; bounce tests
#                 don't need thermal (thermal_correlations does).
mktable:
  workers: 8
  no_thermal: false

param_sets:

  fam_danish_v1_triplets_bin_2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260430]

  fam_danish_v1_triplets_bin_1x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260430]

  fam_danish_1_0_wep17_3_0_bin2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260531]

  fam_danish_1_1_1_wep17_3_0_bin2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260531]

  fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x:
    coord_sys: OCS
    chunks:
      - [20260315, 20260327]
      - [20260331, 20260409]
      - [20260418, 20260531]
      # Newer, DISJOINT visits (post May 13; extra elevation/rotator points) from
      # the danish_1_2_0 wep 17.7.0 reprocessing.  This chunk targets its OWN
      # collection, so the three chunks above keep reading the 17.6.1 collection.
      # Combines into the SAME output/fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x/.
      # Widen day_obs to the new collection's actual span if visits fall outside.
      - day_obs: [20260514, 20260731]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x
      # 20260713 was processed only into /repo/embargo (not yet promoted to
      # /repo/main) under the SAME collection name -> pull it as its own chunk
      # via a per-chunk butler_repo override.  Chunk 4 above nominally covers
      # 0713 but finds nothing for it in /repo/main, so the visits are disjoint
      # (no duplication).  NOTE: once 0713 is promoted to /repo/main, drop this
      # chunk (or narrow chunk 4's dmax) to avoid a duplicate 0713 in the combine.
      - day_obs: [20260713, 20260713]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_embargo0713
        butler_repo: /repo/embargo
      # ---- 2025 FAM (Chris's danish 1.2.0 wep 17.7.0 reprocessing) ----
      # The base 17.7.0 FAM collection spans 2025-04..2026-07, so the 2025 visits
      # are pulled here as per-chunk overrides (own collection + all-programs
      # capture) and combine into the SAME output/<ps>/ table as the 2026 data,
      # so the coadd runs over both years.  programs=[BLOCK,CWFS,AOSSEQUENCE]
      # captures all 2025 FAM (2243 visits); filter stable-vs-S-matrix at coadd
      # time (run_fam_coadd_miw --programs).  Canonical 2025 program groups:
      #   STABLE  : T278 T381 T393 T395 T475 T492 T539 T559 T614 T717 T720 T724
      #   S-MATRIX: T197 T377 T378 T379 T380 T503 T598 T606
      # NB: 2025 corner-WFS lives in a SEPARATE collection (.../cwfs/.../refitWcs/2025);
      # wfs_collections is param_set-level, so 2025 CWFS is not ingested by this
      # merge — wire it up separately if needed (see param_sets.yaml note).
      - day_obs: [20250415, 20250531]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20250601, 20250930]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20251001, 20251115]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20251116, 20251130]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
      - day_obs: [20251201, 20251231]
        collection: LSSTCam/runs/aos/fam/danish_1_2_0/wep_17_7_0/dv_4_7_0/bin_x2/paired/refitWcs
        phrase: aos_fam_danish_1_2_0_wep17_7_0_bin2x_2025
        programs: [BLOCK, CWFS, AOSSEQUENCE]
