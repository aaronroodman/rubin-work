# OptAtmo moment-fit configuration.

geometry:
  diam: 8.36                # Batoid LSST pupilSize
  obscuration: 0.612        # Batoid LSST pupil obscuration
  lam_nm: 750.0
  pixel_scale: 0.2          # arcsec/pixel
  stamp: 32                 # detector stamp (pixels)
  oversample: 16            # FFT oversampling factor
  jmax: 26                  # max Noll index of the wavefront (AOS uses Z4..Z26
                            # omitting Z20,Z21; those coeffs are just never set)
  annular: true             # annular Noll Zernikes (ts_wep/Batoid/CWFS convention)

atmosphere:
  kernel: VonKarman         # VonKarman | Kolmogorov
  L0: 25.0                  # outer scale (m), fixed
  init:   {fwhm: 0.8, g1: 0.0, g2: 0.0}
  bounds: {fwhm: [0.4, 1.6], g1: [-0.2, 0.2], g2: [-0.2, 0.2]}
  fit: [fwhm, g1, g2]       # which atmosphere params are free

# Double-Zernike free optical terms: for each pupil Noll mode, the list of
# focal-plane Noll indices to include (1 = constant, 2/3 = field tilt, ...).
dz_terms:
  - {pupil: 4,  focal: [1]}
  - {pupil: 5,  focal: [1, 2, 3]}
  - {pupil: 6,  focal: [1, 2, 3]}
  - {pupil: 7,  focal: [1]}
  - {pupil: 8,  focal: [1]}
  - {pupil: 9,  focal: [1]}
  - {pupil: 10, focal: [1]}
  - {pupil: 11, focal: [1]}

# Spatially-constant additive offsets in moment space, one free param per listed
# moment (like g1/g2 give a constant e1/e2, but for the higher-order moments).
# NOTE: run_vmode_fit sets this from the `moffsets=` option (off | higher | all |
# csv); 'higher' = the fit moments except e0/e1/e2 (those are the atmosphere's
# fwhm/g1/g2, so offsetting them would be degenerate). This block is the default
# when the fit is driven some other way.
moment_offsets:
  moments: []
  init: 0.0

fit:
  # moments used in the cost.  M22 = <r^4> is the spin-0 (rotation-invariant)
  # 4th-order radial moment (= <x^4> + 2<x^2 y^2> + <y^4>), sensitive to
  # spherical aberration (Z11) / PSF kurtosis.
  moments: [e0, e1, e2, M21, M12, M30, M03, M22]
  # relative weight per moment; the per-point 1/error^2 already normalises the
  # scales, so start with all 1.0 and re-weight here if a moment should pull
  # harder (e.g. up-weight the 3rd moments for the coma/trefoil wavefront).
  weights: {e0: 1.0, e1: 1.0, e2: 1.0, M21: 1.0, M12: 1.0, M30: 1.0, M03: 1.0,
            M22: 1.0}
  fov_radius_deg: 1.75
  # per-detector sub-CCD binning: cell size (deg) and minimum stars per cell.
  # The cost weight is 1/(empirical per-cell scatter)^2; widen cell_deg if the
  # per-cell star counts are too low for a stable scatter estimate.
  cell_deg: 0.15            # ~9 stars/cell, ~2 cells/CCD (per-cell scatter is
                            # noise-dominated, flat vs cell size up to ~0.25 deg)
  min_n: 3

# MIW is read from the Butler intrinsicZernikes calib (miw.MIWCalib); the
# collection/filter/repo are passed by the pipeline (pipelines/config.yaml).

cwfs:
  # observed systematic offsets (CWFS - FAM), microns, per Noll index. Subtracted
  # from the CWFS corner deviation so it is expressed in the FAM / PSF-star
  # system (used by init=cwfs and the corner comparison).
  offsets: {4: -0.11, 11: -0.07, 14: 0.13}

# Tikhonov / MAP regularization (run_vmode_fit reg=<lambda> regmode=<mode>):
#   mode: vmode     -> lambda * sum_i A_i^2              (L2 on v-mode amplitudes)
#         wavefront -> lambda * mean_corner sum_j ((G_v(corner) @ A)_j / sigma_j)^2
#             a Gaussian prior on the wavefront DEVIATION (v-modes only, no MIW)
#             evaluated at the 4 corner field points, with per-Zernike width
#             sigma_j.  lambda=1 is the plain MAP scale; raise it to pull harder.
# sigma_j PROVENANCE: robust RMS (nMAD of residuals about a Huber CWFS-vs-FAM
# fit) from the CWFS-vs-FAM corner comparison -- the 'robust RMS' panel (page 9)
# of  aos/output/fam_danish_1_2_0_wep17_6_1_refitWCS_bin2x/wfs/refitWcs/
# wfs_corner_compare.pdf  -- averaged over the 4 corner rafts, THEN averaged
# within each Noll azimuthal doublet (cos/sin pair: 5/6, 7/8, 9/10, 12/13,
# 14/15, 16/17, 18/19, 23/24, 25/26) so paired terms share one prior width; the
# m=0 singles (4, 11, 22) are unpaired.  Regenerate with:
#     python code/extract_cwfs_sigma.py
regularization:
  # DEFAULT is no regularization (lambda 0): the 20260513 lambda scans showed the
  # Tikhonov term only raised the moment cost with no plateau/knee and ~no gain in
  # CWFS-corner correlation.  Set reg=<lambda> on the CLI to re-enable.
  mode: vmode               # vmode | wavefront
  lambda: 0.0               # vmode-mode prior strength (CLI reg= overrides)
  lambda_wavefront: 0.0     # wavefront-mode default (CLI reg= overrides)
  field: corners            # where the wavefront prior is evaluated
  # penalty shape on the standardized deviation s_j = dev_j/sigma_j (wavefront):
  #   quadratic -> sum s^2            (standard; penalizes small deviations too)
  #   power     -> sum |s|^power      (power>2: flat near 0, steep past sigma)
  #   hinge     -> sum max(|s|-knee,0)^power  (FREE inside +/-knee*sigma, costly outside)
  form: quadratic           # quadratic | power | hinge (CLI regform= overrides)
  power: 2.0                # exponent for power/hinge (CLI regpow= overrides)
  knee: 2.0                 # hinge threshold in sigma units: free below knee*sigma
                            # (CLI regknee= overrides; only used by form: hinge)
  sigma_j:                  # microns; doublet-averaged robust RMS (CWFS vs FAM)
    4: 0.1259
    5: 0.1944
    6: 0.1944
    7: 0.0977
    8: 0.0977
    9: 0.0846
    10: 0.0846
    11: 0.0396
    12: 0.0422
    13: 0.0422
    14: 0.0710
    15: 0.0710
    16: 0.0164
    17: 0.0164
    18: 0.0198
    19: 0.0198
    22: 0.0064
    23: 0.0114
    24: 0.0114
    25: 0.0207
    26: 0.0207

optimizer:
  method: L-BFGS-B
  maxiter: 300
  gtol: 1.0e-8
